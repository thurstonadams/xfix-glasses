<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>xFix Glasses — confirm pairing</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
<style>
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:420px;margin:0 auto;padding:24px 16px;background:#fff;color:#111}
 @media (prefers-color-scheme:dark){body{background:#0e1114;color:#eee}input{background:#1a1f24;color:#eee;border-color:#3a434b}}
 h1{font-size:22px} label{display:block;margin:16px 0 4px;font-size:15px}
 input{width:100%;font-size:22px;padding:12px;border:1px solid #bbb;border-radius:10px;letter-spacing:.15em;text-transform:uppercase}
 input#pin{text-transform:none}
 button{margin-top:20px;width:100%;font-size:18px;padding:14px;border:0;border-radius:10px;background:#0a84ff;color:#fff}
 #out{margin-top:18px;font-size:17px;min-height:24px}
</style></head><body>
<h1>Confirm glasses pairing</h1>
<p>Enter the 6-character code shown on the glasses and the pilot PIN.</p>
<label for="code">Code</label><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" inputmode="text">
<label for="pin">Pilot PIN</label><input id="pin" maxlength="6" inputmode="numeric" autocomplete="off" type="password">
<button id="go">Pair these glasses</button>
<div id="out" role="status"></div>
<script>
const API="https://bjcejlagkrtrtxipdcwb.supabase.co/functions/v1/glasses-api";
const q=new URLSearchParams(location.search); if(q.get("code")) document.getElementById("code").value=q.get("code");
document.getElementById("go").onclick=async()=>{
  const out=document.getElementById("out"); out.textContent="Checking…";
  try{
    const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"pair_confirm",code:document.getElementById("code").value,pin:document.getElementById("pin").value})});
    const j=await r.json();
    out.textContent=j.ok?"✓ Paired. The glasses will continue by themselves within a few seconds.":("✗ "+(j.error||("error "+r.status)));
  }catch(e){out.textContent="✗ Network error";}
};
</script></body></html>
